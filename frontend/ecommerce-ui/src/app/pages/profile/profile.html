<div class="container mt-4 mb-5" style="max-width: 600px;">

  <!-- Header -->
  <div class="d-flex align-items-center justify-content-between mb-4">
    <h2 class="mb-0">👤 My Profile</h2>
    <a routerLink="/products" class="btn btn-outline-secondary btn-sm">← Back</a>
  </div>

  <div class="card shadow-sm border-0 p-4">

    <!-- Current Info -->
    <div class="mb-4">
      <p class="text-muted small mb-1">Current Name</p>
      <h5 class="fw-bold">{{ currentUser?.name }}</h5>

      <p class="text-muted small mb-1 mt-3">Email</p>
      <h6 class="text-muted">{{ currentUser?.email || 'Not available' }}</h6>

      <p class="text-muted small mb-1 mt-3">Role</p>
      <span class="badge"
        [class.bg-danger]="currentUser?.role === 'Admin'"
        [class.bg-primary]="currentUser?.role === 'Customer'">
        {{ currentUser?.role }}
      </span>
    </div>

    <hr>

    <!-- Update Name Form -->
    <h6 class="fw-bold mb-3">Change Name</h6>

    <div class="mb-3">
      <label class="form-label text-muted small">New Name</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="newName"
        placeholder="Enter new name">
    </div>

    <!-- Alerts -->
    <div *ngIf="successMsg" class="alert alert-success py-2">{{ successMsg }}</div>
    <div *ngIf="errorMsg" class="alert alert-danger py-2">{{ errorMsg }}</div>

    <button
      class="btn btn-primary w-100"
      (click)="updateName()"
      [disabled]="isLoading">
      {{ isLoading ? 'Updating...' : 'Update Name' }}
    </button>

  </div>

</div>
