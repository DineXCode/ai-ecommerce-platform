<div class="login-page">

  <!-- Left Panel: Branding -->
  <div class="login-left">
    <div class="brand-content">
      <div class="brand-icon">🛍️</div>
      <h1 class="brand-name">AI E-Commerce</h1>
      <p class="brand-tagline">Smart shopping, powered by AI recommendations.</p>

      <div class="feature-list">
        <div class="feature-item">
          <span class="feature-icon">🤖</span>
          <span>Personalised AI recommendations</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">📦</span>
          <span>Real-time order tracking</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">❤️</span>
          <span>Wishlist & cart management</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Panel: Login Form -->
  <div class="login-right">
    <div class="login-card">

      <div class="login-header">
        <h2>Welcome back</h2>
        <p>Sign in to your account to continue</p>
      </div>

      <!-- Error Message -->
      <div class="error-alert" *ngIf="errorMsg">
        ⚠️ {{ errorMsg }}
      </div>

      <div class="form-group">
        <label>Email address</label>
        <input
          [(ngModel)]="email"
          type="email"
          placeholder="dine@gmail.com"
          class="form-input"
          (keyup.enter)="login()">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          [(ngModel)]="password"
          type="password"
          placeholder="Enter your password"
          class="form-input"
          (keyup.enter)="login()">
      </div>

      <button
        class="login-btn"
        (click)="login()"
        [disabled]="isLoading">
        {{ isLoading ? 'Signing in...' : 'Sign in' }}
      </button>

      <p class="register-link">
        Don't have an account?
        <a routerLink="/register">Create one</a>
      </p>

    </div>
  </div>

</div>
